<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="https://logodownload.org/wp-content/uploads/2017/04/instagram-logo-3.png" type="image/x-icon">
<body>
    <main>
        <div id="main-container">
            <div id="banner-container">
                <img src="https://p16-capcut-cms-sg.ibyteimg.com/tos-alisg-i-6rr7idwo9f-sg/4234875e83f14b06bec973028d770313~tplv-6rr7idwo9f-image.image" alt="Crie uma conta no Instagram" />
            </div>

            <div id="form-container">
             <div id="form-box">
                    <img id="logo-insta" src="https://logos-world.net/wp-content/uploads/2020/04/Instagram-Logo-2010-2013.png" alt="Instagram" />
                <form id="login-form">
                    <input
                    type="text"
                    name="username"
                    placeholder="Número de telefone, usuário ou e-mail" 
                    />
                    <input
                    type="password"
                    name="password"
                    placeholder="Senha"
                    />
                    <input
                    type="submit"
                    value="Entrar"
                    />
                </form>
                <div class="separator">
                 <div class="line">
                     <span>Ou</span>
                 </div>
                </div>
                <div id="other-links">
                    <div class="facebook-login">
                     <a href="#">
                        <img src="https://logodownload.org/wp-content/uploads/2014/09/facebook-logo-2-1.png" alt="Facebook Login">
                        <span>Entrar com o Facebook</span>
                     </a>
                    </div>
                    <div id="forgot-pas">
                        <a href="#">Esqueceu a senha?</a>
                    </div>
                </div>
             </div>
             <div id="register-container">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
             </div>
        </div>
    </main>
    <footer>
        <nav>
            <ul id="footer-links">
                <li><a href="#">Meta</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Carreiras</a></li>
                <li><a href="#">Ajuda</a></li>
                <li><a href="#">API</a></li>
                <li><a href="#">Privacidade</a></li>
                <li><a href="#">Termos</a></li>
                <li><a href="#">Localizações</a></li>
                <li><a href="#">Instagram Lite</a></li>
                <li><a href="#">Threads</a></li>
            </ul>
        </nav>
        <p id="copyright">&copy;2025 Instagram from Meta</p>
    </footer>
</body>
</html>
